# Écrans React (routes /formateur, /etudiant, /relecture) et relais de l'API : même origine, pas de CORS (ADR-7)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par Vite : noms versionnés, mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute autre route renvoie index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
