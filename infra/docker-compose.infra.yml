# Outillage OPTIONNEL, indépendant de l'application (docker-compose.yml) — voir docs/INFRA.md.
#   docker compose -f infra/docker-compose.infra.yml --env-file .env up -d
# SonarQube exige vm.max_map_count >= 524288 sous Linux et environ 3 Go de RAM ; Nexus environ 2,5 Go.
name: kfokam48-infra

services:
  sonarqube-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    # Pas de healthcheck : l'image n'embarque ni curl ni wget. infra/sonar/init.sh attend /api/system/status = UP.

  nexus:
    image: sonatype/nexus3
    ports:
      - "${NEXUS_PORT:-8081}:8081"   # interface web, dépôts Maven (maven-public)
      - "8082:8082"                  # docker-proxy : cache de Docker Hub
      - "8083:8083"                  # docker-hosted : registre privé des images du projet
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/service/rest/v1/status/writable || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  nexus-data:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
