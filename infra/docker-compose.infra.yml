# Outillage OPTIONNEL, indépendant de l'application (docker-compose.yml) — voir docs/INFRA.md.
#   docker compose -f infra/docker-compose.infra.yml --env-file .env up -d
# SonarQube exige vm.max_map_count >= 524288 sous Linux et environ 3 Go de RAM.
name: kfokam48-infra

services:
  sonarqube-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    # Pas de healthcheck : l'image n'embarque ni curl ni wget. infra/sonar/init.sh attend /api/system/status = UP.

volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
