# Mises à jour de dépendances : une fois par mois, 2 PR ouvertes au plus par écosystème
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Versions majeures exclues : Spring Boot 3.5 et Java 17 sont figés (ADR-2) ; springdoc 3.x cible Boot 4 (#33)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Versions majeures exclues : Spring Boot 3.5 et Java 17 sont figés (ADR-2) ; springdoc 3.x cible Boot 4 (#33)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
