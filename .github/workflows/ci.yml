name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Détermine quelles parties du dépôt ont changé, pour ne lancer que les jobs utiles
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filtre.outputs.api }}
      backend: ${{ steps.filtre.outputs.backend }}
      frontend: ${{ steps.filtre.outputs.frontend }}
      docker: ${{ steps.filtre.outputs.docker }}
      frontend-existe: ${{ steps.existe.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtre
        with:
          filters: |
            api:
              - 'api/**'
              - 'redocly.yaml'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'api/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'api/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose.yml'
              - '**/Dockerfile'
              - '.dockerignore'
              - 'scripts/**'
              - 'postman/**'
              - '.github/workflows/ci.yml'
      - id: existe
        run: echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  contract-lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint du contrat d'API (Redocly)
        run: npx --yes @redocly/cli@2.54.3 lint api/contrat.yaml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build, tests unitaires et d'intégration, couverture
        run: ./mvnw -B -ntp verify
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

  # Prêt pour le ticket #3 : ignoré tant que frontend/ n'existe pas
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.frontend-existe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Application conteneurisée de bout en bout : docker compose + tests de fumée + collection Newman
  compose-smoke:
    needs: [changes, backend]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.backend.result != 'failure'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    env:
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Démarrer l'application (PostgreSQL + backend + données de démo)
        run: docker compose up -d --build --wait
      - name: Tests de fumée
        run: bash scripts/smoke.sh
      - name: Collection Postman (Newman)
        run: >-
          npx --yes newman@6.2.2 run postman/KFOKAM48.postman_collection.json
          -e postman/local.postman_environment.json
          --reporters cli,junit --reporter-junit-export newman/junit.xml
      - name: Journaux des conteneurs
        if: failure()
        run: docker compose logs
      - name: Rapport Newman
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-newman
          path: newman/
          if-no-files-found: ignore
      - name: Arrêter et nettoyer
        if: always()
        run: docker compose down -v
