name: CI

# Pipeline unique : prebuild → tests-unitaires → sonar → build.
# Sur une PR vers main, il s'arrête à sonar ; le build ne s'exécute que sur la branche critique main.
# Les tests d'intégration, la fumée docker compose et Newman font partie de la porte locale (CONTRIBUTING.md).
# La sécurité (CodeQL, Gitleaks, dependency-review) est un workflow séparé : security.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Contrat d'API valide et code qui compile
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint du contrat d'API (Redocly)
        run: npx --yes @redocly/cli@2.54.3 lint api/contrat.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compilation
        working-directory: backend
        run: ./mvnw -B -ntp compile

  # Tests unitaires, couverture JaCoCo et seuil de 70 % sur les services
  tests-unitaires:
    needs: prebuild
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests unitaires et couverture
        run: ./mvnw -B -ntp test jacoco:report jacoco:check@seuil-service
      - name: Classes compilées et rapports (réutilisés par sonar)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-tests
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

  # Analyse SonarQube OPTIONNELLE : seulement si la variable SONAR_HOST_URL et le secret SONAR_TOKEN existent
  sonar:
    needs: tests-unitaires
    if: vars.SONAR_HOST_URL != ''
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Secret SONAR_TOKEN absent → analyse ignorée
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN non défini, analyse SonarQube ignorée"
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: resultats-tests
          path: backend/target
      - uses: actions/setup-java@v6
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Analyse et Quality Gate (sans relancer les tests)
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: ./mvnw -B -ntp sonar:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait=true

  # Livrables : uniquement sur main, après les tests (et Sonar s'il est configuré)
  build:
    needs: [tests-unitaires, sonar]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.tests-unitaires.result == 'success'
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Jar du backend
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests
      - name: Image Docker du backend
        run: docker build -f backend/Dockerfile --build-arg GIT_COMMIT="${GITHUB_SHA::7}" -t "kfokam48/presence-backend:${GITHUB_SHA::7}" .
      - uses: actions/upload-artifact@v7
        with:
          name: presence-backend-jar
          path: backend/target/presence-*.jar
