name: "Chore / tâche technique"
description: "Une tâche technique sans résultat visible par l'utilisateur (socle, CI, outillage)"
title: "[CHORE] <résultat technique attendu>"
labels: ["type:chore"]
body:
  - type: textarea
    id: objectif
    attributes:
      label: "Objectif technique"
      placeholder: "Ce que la tâche met en place, et pourquoi"
    validations: { required: true }
  - type: textarea
    id: critere
    attributes:
      label: "Critère de fin vérifiable"
      value: |
        - [ ] Commande ou vérification qui prouve que c'est terminé
    validations: { required: true }
  - type: input
    id: exigences
    attributes:
      label: "Exigences et contraintes couvertes"
      placeholder: "B1, B5, ENF6"
    validations: { required: true }
