# Configuration par variables d'environnement, avec des valeurs par défaut de développement
spring:
  application:
    name: presence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kfokam48}
    username: ${DB_USER:kfokam48}
    password: ${DB_PASSWORD:kfokam48}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # 12.5 n'est pas converti en 12 : une note décimale est refusée (RG11)
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    java:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: Contrat imposé
    urls:
      - name: Contrat imposé
        url: /contrat.yaml
      - name: Implémentation
        url: /v3/api-docs
